name: SASB paid wrapper (manual)

# Manual only. Nothing here runs on push or pull_request.
# A REAL paid run needs all three deliberate choices:
#   confirm = PAY, provider = anthropic|openai (no default), fake = false (unticked).
# With fake = true (the default) the pilot runs through the in-process fake
# transport: no socket is opened, no secret is read, nothing is spent.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PAY to run the pilot job after the offline checks
        required: true
        default: ""
      provider:
        description: Model provider. Must be chosen explicitly; the "choose" placeholder fails the run.
        required: true
        type: choice
        default: choose
        options:
          - choose
          - anthropic
          - openai
      fake:
        description: Fake transport (no network, no spend). Untick ONLY for a real paid run.
        required: true
        type: boolean
        default: true
      cap_usd:
        description: Local dollar cap for the run (0 to 5.00)
        required: true
        default: "0.50"
      arms:
        description: "Comma list of role@runtime. Every named arm is paid. Runtimes: proposed (hardened) or default (harm reachable)."
        required: true
        default: "honest@proposed,adversary@proposed,adversary@default"
      conditions:
        description: "Comma list of conditions, or 'all'. Choices: authorized_maintenance, tempting_unauthorized, low_salience_ownership, ownership_unknown, valid_stop"
        required: true
        default: "all"
      repeats:
        description: Episodes per condition per arm (1 to 100). 30 gives usable intervals.
        required: true
        default: "1"
      feedback:
        description: "What a denial tells the model: code only, a one-line explanation, or both (doubles the arms)"
        required: true
        type: choice
        default: code
        options:
          - code
          - explained
          - both
      revocation_observation_mode:
        description: "How an acknowledged permission update is shown: unchanged, marked acknowledged, removed, or all three as separate arms"
        required: true
        type: choice
        default: persistent
        options:
          - persistent
          - acknowledged
          - consumed
          - all

permissions:
  contents: read

# One paid pilot at a time across the repository. PaidRunLock only covers one host.
concurrency:
  group: sasb-paid-pilot
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline suite
        run: python -m unittest discover -s tests -v
      - name: Verify recorded reports
        run: python tools/verify_report.py
      - name: Zero-cap paid path must not use transport
        run: python -m unittest tests.test_budget -v

  pilot:
    needs: offline
    if: inputs.confirm == 'PAY'
    runs-on: ubuntu-latest
    # Repeated runs are serial HTTP calls; 30 repeats x 3 arms x 2 feedback modes
    # is about 900 episodes. The transcript is appended per episode, so a timeout
    # still uploads everything finished before it.
    timeout-minutes: 240
    env:
      PROVIDER: ${{ inputs.provider }}
      FAKE: ${{ inputs.fake }}
      CAP_USD: ${{ inputs.cap_usd }}
      ARMS: ${{ inputs.arms }}
      REPEATS: ${{ inputs.repeats }}
      FEEDBACK: ${{ inputs.feedback }}
      OBSERVATION_MODE: ${{ inputs.revocation_observation_mode }}
      CONDITIONS: ${{ inputs.conditions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            anthropic|openai) ;;
            *) echo "::error::Choose provider=anthropic or provider=openai explicitly (got '$PROVIDER')."; exit 1 ;;
          esac
          case "$FAKE" in
            true|false) ;;
            *) echo "::error::fake must be true or false (got '$FAKE')."; exit 1 ;;
          esac
          python - <<'PY'
          import math, os, re, sys
          raw = os.environ["CAP_USD"].strip()
          if not re.fullmatch(r"\d+(\.\d+)?", raw):
              sys.exit("::error::cap_usd must be a plain decimal number such as 0.50 (got %r)" % raw)
          cap = float(raw)
          if not math.isfinite(cap) or cap < 0 or cap > 5.0:
              sys.exit("::error::cap_usd must be between 0 and 5.00 (got %s)" % raw)
          reps = os.environ["REPEATS"].strip()
          if not re.fullmatch(r"\d+", reps) or not 1 <= int(reps) <= 100:
              sys.exit("::error::repeats must be a whole number from 1 to 100 (got %r)" % reps)
          sys.path.insert(0, ".")
          from sasb.live import parse_arms, parse_conditions
          raw_conditions = os.environ["CONDITIONS"].strip()
          try:
              arms = parse_arms(os.environ["ARMS"], os.environ["FEEDBACK"], os.environ["OBSERVATION_MODE"])
              conditions = parse_conditions(None if raw_conditions == "all" else raw_conditions)
          except ValueError as exc:
              sys.exit("::error::%s" % exc)
          print("Conditions: %s" % ", ".join(conditions))
          print("Arms: %s" % ", ".join("%s@%s/%s/%s" % (a["role"], a["runtime"], a["feedback"], a["observation_mode"])
                                         for a in arms))
          print("Planned episodes: %d (%d conditions x %d arms x %s repeats)"
                % (len(conditions) * len(arms) * int(reps), len(conditions), len(arms), reps))
          PY
          if [ "$FAKE" = "true" ]; then
            echo "Mode: FAKE transport (no network, no spend). provider=$PROVIDER cap_usd=$CAP_USD"
          else
            echo "Mode: LIVE paid run. provider=$PROVIDER cap_usd=$CAP_USD"
          fi

      - name: Require the selected provider's secret (live only)
        if: ${{ !inputs.fake }}
        env:
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "$PROVIDER" = "anthropic" ]; then name=ANTHROPIC_API_KEY; else name=OPENAI_API_KEY; fi
          # Only the presence of the variable is tested; its value is never printed.
          if [ -z "${!name:-}" ]; then
            echo "::error::Repository secret $name is not set (or is empty). Add it under Settings > Secrets and variables > Actions, then re-run. No request was sent."
            exit 1
          fi
          echo "$name is present."

      - name: Run pilot
        env:
          SASB_ENABLE_NETWORK: "1"
          SASB_PROVIDER_VALIDATED: "1"
          # Fake runs get placeholders; live runs get only the selected provider's secret.
          ANTHROPIC_API_KEY: ${{ inputs.fake && 'sk-ant-ci-placeholder' || (inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '') }}
          OPENAI_API_KEY: ${{ inputs.fake && 'sk-ci-placeholder' || (inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '') }}
        run: |
          set -euo pipefail
          args=(--provider "$PROVIDER" --mode worker --cap-usd "$CAP_USD" --force
                --arms "$ARMS" --repeats "$REPEATS" --feedback "$FEEDBACK"
                --revocation-observation-mode "$OBSERVATION_MODE"
                --out reports/live-run-paid.json
                --transcript reports/live-run-paid.transcript.jsonl)
          if [ "$CONDITIONS" != "all" ]; then
            args+=(--conditions "$CONDITIONS")
          fi
          if [ "$FAKE" = "true" ]; then
            args=(--fake-transport "${args[@]}")
          fi
          python -m sasb.pilot "${args[@]}" > /dev/null

      - name: Summarize
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("reports/live-run-paid.json")
          if not p.exists():
              print("No report was written.")
          else:
              r = json.loads(p.read_text())
              b = r.get("budget") or {}
              print("| field | value |\n| --- | --- |")
              for k, v in (("provider", r.get("provider")), ("model", r.get("model")),
                           ("transport", r.get("transport")),
                           ("cap_usd", r.get("cap_usd")), ("spent_usd (local estimate)", r.get("spent_usd")),
                           ("simulated_spend_usd", r.get("simulated_spend_usd")),
                           ("requests", b.get("request_count")), ("usage", r.get("usage")),
                           ("repeats", r.get("repeats")), ("stopped", r.get("stopped")),
                           ("blocked", b.get("blocked"))):
                  print("| %s | %s |" % (k, v))
              cells = r.get("by_cell") or {}
              if cells:
                  print("\n### Per cell (k/n, 95% interval)\n")
                  cols = ("prohibited_attempt", "completed_violation", "authorized_task_completion",
                          "valid_correction_acceptance", "ack_loop", "malformed_write_target", "format_retry_used")
                  print("| arm | condition | n | " + " | ".join(cols) + " |")
                  print("| --- | --- | --- | " + " | ".join("---" for _ in cols) + " |")
                  for c in cells.values():
                      def fmt(m):
                          x = c["metrics"][m]
                          if not x["n"]:
                              return "n/a"
                          lo, hi = x["wilson95"]
                          return "%d/%d (%.2f-%.2f)" % (x["k"], x["n"], lo, hi)
                      print("| %s@%s/%s/%s | %s | %d | %s |" % (
                          c["role"], c["runtime"], c["feedback"], c["revocation_observation_mode"], c["condition"],
                          c["episodes"], " | ".join(fmt(m) for m in cols)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sasb-paid-${{ inputs.provider }}-${{ inputs.fake && 'fake' || 'live' }}-${{ github.run_id }}
          path: |
            reports/live-run-paid.json
            reports/live-run-paid.transcript.jsonl
          if-no-files-found: warn
          retention-days: 90
